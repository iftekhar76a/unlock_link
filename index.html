<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>প্রিমিয়াম আনলক সিস্টেম</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); min-height:100vh; display:flex; justify-content:center; align-items:center; }
        .container { background:white; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3); padding:40px; max-width:500px; width:90%; }
        h1 { color:#333; margin-bottom:20px; text-align:center; }
        .timer-box { background:#f0f0f0; border-radius:10px; padding:20px; margin:20px 0; text-align:center; }
        #timer { font-size:48px; font-weight:bold; color:#667eea; }
        .ad-container { margin:20px 0; padding:20px; border:2px dashed #667eea; border-radius:10px; text-align:center; }
        .btn { background:linear-gradient(135deg,#667eea 0%,#764ba2 100%); color:white; border:none; padding:12px 30px; border-radius:25px; font-size:16px; cursor:pointer; transition:transform 0.3s; width:100%; margin:10px 0; }
        .btn:hover { transform:translateY(-2px); }
        .btn:disabled { opacity:0.5; cursor:not-allowed; }
        .access-granted { background:#d4edda; color:#155724; padding:20px; border-radius:10px; margin-top:20px; text-align:center; }
        .countdown { font-size:14px; color:#666; margin-top:10px; }
        .admin-link { position:fixed; bottom:20px; right:20px; background:rgba(0,0,0,0.1); padding:10px; border-radius:5px; }
        .admin-link a { color:#333; text-decoration:none; font-size:14px; }
        .info { text-align:center; margin-top:20px; color:#666; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <h1>🌟 প্রিমিয়াম কন্টেন্ট আনলক</h1>
        <div v-if="!hasAccess && !redirecting">
            <div class="timer-box">
                <div id="timer">{{ formattedTime }}</div>
                <p>এড দেখতে বাকি</p>
            </div>
            <div class="ad-container">
                <p>একটি এড দেখে ২৪ ঘন্টা এক্সেস পান!</p>
                <button class="btn" @click="watchAd" :disabled="isWatching">
                    {{ isWatching ? 'এড চলছে...' : 'এড দেখুন' }}
                </button>
            </div>
        </div>
        <div v-else-if="hasAccess && !redirecting" class="access-granted">
            <h2>🎉 আপনার এক্সেস আছে!</h2>
            <p>নিচের বাটনে ক্লিক করে কন্টেন্ট দেখুন</p>
            <button class="btn" @click="goToTarget">এগিয়ে যান</button>
            <div class="countdown">এক্সেস শেষ হবে: {{ remainingTime }}</div>
        </div>
        <div v-if="redirecting" class="info">
            <p>রিডাইরেক্ট হচ্ছে, দয়া করে অপেক্ষা করুন...</p>
        </div>
        <div class="admin-link">
            <a href="/admin">🔐 এডমিন প্যানেল</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        new Vue({
            el: '#app',
            data: {
                hasAccess: false,
                isWatching: false,
                timeLeft: 10,
                accessUntil: null,
                timer: null,
                userId: null,
                shortCode: null,
                targetUrl: null,
                redirecting: false,
                settings: { adDuration: 10, accessHours: 24, defaultTargetUrl: '' }
            },
            computed: {
                formattedTime() { return `${this.timeLeft} সেকেন্ড`; },
                remainingTime() {
                    if (!this.accessUntil) return '';
                    const remaining = this.accessUntil - Date.now();
                    if (remaining <= 0) return 'এক্সেস শেষ';
                    const hours = Math.floor(remaining / (1000 * 60 * 60));
                    const minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                    return `${hours} ঘন্টা ${minutes} মিনিট`;
                }
            },
            methods: {
                getUserId() {
                    let uid = localStorage.getItem('userId');
                    if (!uid) {
                        uid = 'user_' + Math.random().toString(36).substr(2, 9);
                        localStorage.setItem('userId', uid);
                    }
                    return uid;
                },
                async fetchSettings() {
                    try {
                        const res = await axios.get('/api/admin/settings');
                        this.settings = res.data;
                        this.timeLeft = this.settings.adDuration || 10;
                    } catch (e) { console.log('Using default settings'); }
                },
                async checkAccess() {
                    this.userId = this.getUserId();
                    const path = window.location.pathname;
                    if (path && path !== '/' && path !== '/index.html') {
                        this.shortCode = path.substring(1);
                    }
                    try {
                        const res = await axios.get('/api/check-access', { params: { userId: this.userId, link: this.shortCode } });
                        this.hasAccess = res.data.hasAccess;
                        this.accessUntil = res.data.accessUntil ? new Date(res.data.accessUntil) : null;
                        this.targetUrl = res.data.targetUrl || this.settings.defaultTargetUrl;
                        if (this.hasAccess && this.targetUrl) setTimeout(() => this.goToTarget(), 2000);
                    } catch (error) { console.error('Access check failed', error); }
                },
                watchAd() {
                    this.isWatching = true;
                    this.timeLeft = this.settings.adDuration || 10;

                    // ⚠️ আপনার প্রকৃত এড লিংক এখানে বসান (যেটা এড নেটওয়ার্ক দিয়েছে)
                    var adUrl = 'https://www.effectivegatecpm.com/click.php?key=84bc07cb571999eb2f4a1357901d8702'; 
                    window.open(adUrl, '_blank');

                    this.timer = setInterval(() => {
                        this.timeLeft--;
                        if (this.timeLeft <= 0) {
                            clearInterval(this.timer);
                            this.completeAd();
                        }
                    }, 1000);
                },
                async completeAd() {
                    this.isWatching = false;
                    try {
                        const res = await axios.post('/api/grant-access', { userId: this.userId });
                        if (res.data.success) {
                            this.hasAccess = true;
                            this.accessUntil = new Date(res.data.accessUntil);
                            localStorage.setItem('accessUntil', this.accessUntil.getTime());
                            if (this.targetUrl) setTimeout(() => this.goToTarget(), 2000);
                        }
                    } catch (error) { alert('এক্সেস নিতে সমস্যা। আবার চেষ্টা করুন।'); }
                },
                goToTarget() {
                    if (this.targetUrl) { this.redirecting = true; window.location.href = this.targetUrl; }
                    else alert('গন্তব্য লিংক নির্ধারিত হয়নি।');
                }
            },
            async mounted() {
                await this.fetchSettings();
                await this.checkAccess();
                const savedAccess = localStorage.getItem('accessUntil');
                if (savedAccess && new Date(parseInt(savedAccess)) > new Date()) {
                    this.hasAccess = true;
                    this.accessUntil = new Date(parseInt(savedAccess));
                }
            }
        });
    </script>
</body>
</html>
